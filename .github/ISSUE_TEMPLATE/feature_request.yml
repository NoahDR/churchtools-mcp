name: Feature request
description: A tool or behaviour the server should have.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The task in your church's words, not the solution. For example "staff next month's services in one go".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: With ct_api_request, by hand in ChurchTools, or not at all.
  - type: textarea
    id: endpoints
    attributes:
      label: ChurchTools endpoints involved
      description: If you know them, for example `GET /events`.
