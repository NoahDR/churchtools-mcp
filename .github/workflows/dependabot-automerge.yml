name: Dependabot auto-merge

# pull_request_target runs this file as it is on main, so a pull request cannot change what it does.
# It never checks out or runs code from the pull request: it only reads metadata and calls the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require every commit to be a verified Dependabot commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          foreign=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')
          if [ -n "$foreign" ]; then
            echo "::error::Commits not made by Dependabot: $foreign"
            exit 1
          fi
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Patch and minor updates only: a major update can break the API and needs a human.
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" --body "Patch or minor update by Dependabot: approved, merges once CI passes."
          gh pr merge --auto --squash "$PR_URL"
